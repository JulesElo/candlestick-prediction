[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candlestick-prediction"
version = "0.1.0"
description = "Análise e validação de Redes Neurais Convolucionais (CNN, ResNet) para predição de tendências no par USDT/BRL através de gráficos de candlestick."
dependencies = [
    "torch",
    "torchvision",
    "pandas",
    "matplotlib",
    "mplfinance",
    "scikit-learn",
    "seaborn",
    "tqdm",
    "requests",
    "Pillow",
    "numpy"
]
